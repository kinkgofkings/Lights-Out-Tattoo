<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="100" fill="#060913" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="14 10" opacity="0.8" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5" />
  
  <!-- Outer Broken Lightbulb Silhouette -->
  <!-- Bulb Head with jagged fractures -->
  <path d="M190 320 C160 290 140 245 140 200 C140 135 192 82 256 82 C320 82 372 135 372 200 C372 245 352 290 322 320 Z" 
        fill="#0a1224" stroke="url(#cyanGrad)" stroke-width="8" />
  
  <!-- Shattered Glass Fractures -->
  <path d="M210 110 L250 170 L235 220 L275 260 L260 310" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M250 170 L305 155 L335 190" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  <path d="M235 220 L175 240 L155 210" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  
  <!-- Electric High-Voltage Spark / Arcs inside shattered bulb -->
  <path d="M256 120 L240 160 L272 175 L245 230 L280 245 L250 300" fill="none" stroke="#ffffff" stroke-width="4" filter="url(#neonGlow)" />
  <circle cx="245" cy="230" r="6" fill="#00f0ff" filter="url(#neonGlow)" />
  <circle cx="272" cy="175" r="4" fill="#ffffff" />
  
  <!-- Bulb Screw Base (Tattoo Machine Coil/Screw motif) -->
  <rect x="200" y="324" width="112" height="18" rx="6" fill="#0d1b33" stroke="#00f0ff" stroke-width="4" />
  <rect x="208" y="348" width="96" height="18" rx="6" fill="#0d1b33" stroke="#0066ff" stroke-width="4" />
  <rect x="216" y="372" width="80" height="18" rx="6" fill="#0d1b33" stroke="#00f0ff" stroke-width="4" />
  <path d="M228 396 Q256 420 284 396 Z" fill="#00f0ff" />
  
  <!-- Tattoo Needle Point extending from bulb base -->
  <polygon points="253,410 259,410 256,460" fill="#00f0ff" filter="url(#neonGlow)" />
  
  <!-- Voltage Bolts on left & right -->
  <path d="M90 200 L120 215 L105 240 L135 255" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
  <path d="M422 200 L392 215 L407 240 L377 255" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
</svg>
